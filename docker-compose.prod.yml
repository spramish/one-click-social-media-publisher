# ===========================================================================
# One-Click Social Media Video Publisher — PRODUCTION stack
# Author: Pramish Sharma
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Differences from the local stack (docker-compose.yml):
#   * images are built from Dockerfile.prod (no compilers, no dev server);
#   * no source bind-mounts and no --reload — the image is the deployable unit;
#   * PostgreSQL and Redis publish NO host ports; only nginx is reachable;
#   * TLS terminates at nginx, which is the single public entry point;
#   * a dedicated Celery Beat container drives the periodic sweeps.
#
# Read docs/DEPLOYMENT.md before running this.
# ===========================================================================
name: one-click-publisher

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  REDIS_HOST: redis
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-publisher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-publisher_db}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    image: postgres:16-alpine
    container_name: ocp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-publisher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-publisher_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-publisher} -d ${POSTGRES_DB:-publisher_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ocp_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: ocp-backend:latest
    container_name: ocp_backend
    restart: always
    env_file: .env
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RATE_LIMIT_ENABLED: "true"
    volumes:
      - media_data:/app/var/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ocp-backend:latest
    container_name: ocp_worker
    restart: always
    env_file: .env
    environment:
      <<: *backend-env
    volumes:
      - media_data:/app/var/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ``solo`` pool keeps one task at a time per container; scale the service
    # (`--scale worker=N`) rather than raising concurrency in-process.
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--pool=solo"]

  beat:
    image: ocp-backend:latest
    container_name: ocp_beat
    restart: always
    env_file: .env
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the public API URL}
    image: ocp-frontend:latest
    container_name: ocp_frontend
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: ocp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_data:
  nginx_cache:
