# ===========================================================================
# nginx — single public entry point for the production stack
# Author: Pramish Sharma
#
#   http  → redirect to https
#   /api/ → backend (FastAPI), streaming request bodies with no buffering so a
#           large resumable upload is not held in nginx's memory
#   /     → frontend (Next.js server)
#
# TLS certificates are mounted read-only from deploy/certs (see DEPLOYMENT.md).
# ===========================================================================

upstream ocp_backend {
    server backend:8000;
    keepalive 16;
}

upstream ocp_frontend {
    server frontend:3000;
    keepalive 16;
}

# Requests larger than the app's own MEDIA_MAX_UPLOAD_BYTES must be refused by
# nginx first, otherwise the client gets a connection reset instead of a JSON
# error. Keep this at or above MEDIA_MAX_UPLOAD_BYTES.
client_max_body_size 2g;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt's HTTP-01 challenge is answered before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app sets its own HSTS/security headers; nginx must not duplicate them.
    # Trust the proxy's protocol and client address so the API can build correct
    # rate-limit keys from the first hop of X-Forwarded-For.
    location /api/ {
        proxy_pass http://ocp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 2 GiB uploads over a slow link need more than the 60 s default.
        proxy_request_buffering off;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    location / {
        proxy_pass http://ocp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
